<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- Dashboard Skeleton -->
    <div th:fragment="dashboard-skeleton" class="skeleton-wrapper" id="dashboard-skeleton">
        <!-- Stats Cards Skeleton -->
        <div class="stats-container" style="margin-bottom: 30px;">
            <div class="skeleton-stat-card" th:each="i : ${#numbers.sequence(1, 4)}">
                <div class="skeleton-line skeleton-title"></div>
                <div class="skeleton-line skeleton-value"></div>
                <div class="skeleton-line skeleton-link"></div>
            </div>
        </div>

        <!-- Service Cards Skeleton -->
        <div class="services-grid">
            <div class="skeleton-service-card" th:each="i : ${#numbers.sequence(1, 6)}">
                <div class="skeleton-line skeleton-service-title"></div>
                <div class="skeleton-line skeleton-service-desc"></div>
                <div class="skeleton-line skeleton-service-desc"></div>
                <div class="skeleton-line skeleton-service-link"></div>
            </div>
        </div>
    </div>

    <!-- Card List Skeleton -->
    <div th:fragment="card-list-skeleton" class="skeleton-wrapper" id="card-list-skeleton">
        <div class="skeleton-card-item" th:each="i : ${#numbers.sequence(1, 3)}">
            <div class="skeleton-card-preview"></div>
            <div style="flex: 1;">
                <div class="skeleton-line skeleton-card-title"></div>
                <div class="skeleton-line skeleton-card-subtitle"></div>
            </div>
        </div>
    </div>

    <!-- Form Skeleton -->
    <div th:fragment="form-skeleton" class="skeleton-wrapper" id="form-skeleton">
        <div class="skeleton-form-group" th:each="i : ${#numbers.sequence(1, 3)}">
            <div class="skeleton-line skeleton-label"></div>
            <div class="skeleton-line skeleton-input"></div>
        </div>
        <div class="skeleton-line skeleton-button"></div>
    </div>

    <!-- Generic Content Skeleton -->
    <div th:fragment="content-skeleton" class="skeleton-wrapper" id="content-skeleton">
        <div class="skeleton-line skeleton-heading"></div>
        <div class="skeleton-line skeleton-text"></div>
        <div class="skeleton-line skeleton-text"></div>
        <div class="skeleton-line skeleton-text" style="width: 60%;"></div>
    </div>
</body>

</html>
