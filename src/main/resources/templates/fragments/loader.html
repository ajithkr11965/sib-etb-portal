    <!-- Loader Logic -->
    <script th:fragment="loader-script">
        document.addEventListener("DOMContentLoaded", function () {
            const loader = document.getElementById('global-loader');

            let loaderStartTime = 0;
            const MIN_VISIBLE_TIME = 5000; // 5 Seconds Minimum Duration

            function showLoader() {
                if (loader) {
                    loaderStartTime = Date.now();
                    loader.style.display = 'flex';
                    loader.classList.remove('fade-out');
                    loader.classList.add('fade-in');
                }
            }

            function hideLoader() {
                if (loader) {
                    const elapsed = Date.now() - loaderStartTime;
                    const remaining = MIN_VISIBLE_TIME - elapsed;
                    const delay = remaining > 0 ? remaining : 0;

                    setTimeout(() => {
                        loader.classList.remove('fade-in');
                        loader.classList.add('fade-out');
                        setTimeout(() => {
                            loader.style.display = 'none';
                        }, 300); // Wait for transition
                    }, delay);
                }
            }

            // 1. Page Transitions (Navigation)
            window.addEventListener('beforeunload', function (e) {
                // Don't show on mailto: or tel: links or # hashes
                if (!e.defaultPrevented) {
                    showLoader();
                }
            });

            // 2. Fetch Interceptor
            const originalFetch = window.fetch;
            window.fetch = async function (...args) {
                showLoader();
                try {
                    const response = await originalFetch(...args);
                    return response;
                } catch (error) {
                    throw error;
                } finally {
                    hideLoader();
                }
            };

            // 3. Form Submissions
            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', function () {
                    if (form.checkValidity()) {
                        showLoader();
                    }
                });
            });

            // Initial Hide (in case browser cached page state)
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) {
                    hideLoader();
                }
            });

            // Hide on load completion
            window.addEventListener('load', hideLoader);
        });
    </script>
</body>
