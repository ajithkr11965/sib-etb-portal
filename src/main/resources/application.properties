spring.application.name=SIB Portal
spring.thymeleaf.cache=false

# API Configuration
step.api.mock.enabled=true
api.base-url.auth=https://api.sib.com/auth
api.base-url.customer=https://api.sib.com/customer
api.base-url.cards=https://api.sib.com/cards

# Centralized Logging API Configuration
# Points to the LogReceiver servlet in the legacy Tomcat application
logging.api.url=https://infobankuat.sib.co.in:8443/iBank/api/logs
logging.api.enabled=true
logging.api.retry.max-attempts=3
logging.api.retry.delay-ms=1000
logging.api.timeout-ms=5000
